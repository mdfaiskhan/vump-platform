# The pull request title, alone, because it has to re-validate when the title
# CHANGES — and until Mission 7.11 it did not.
#
# ADR-019 makes the PR title the squash-merge commit message, the message that
# actually lands in develop's history, so `ci.yml` has validated it since it was
# written. It validated it on the wrong events.
#
# `ci.yml`'s `pull_request:` trigger carries no `types:`, so GitHub applies the
# default `[opened, synchronize, reopened]`. **`edited` is absent, and renaming a
# pull request fires exactly that event.** A title corrected in response to this
# check was therefore never re-examined: the run a reviewer sees is still the one
# from `opened`, still reporting the original title.
#
# **The check's own failure message asks the author to fix the title, and the
# obvious way to do that did nothing.** A control whose documented remedy is
# silently inert is worse than no control, because the author believes they
# acted. Found at Mission 7.11 after several renames appeared to be ignored.
#
# It lives here rather than adding `edited` to `ci.yml` because that trigger
# fires on every description edit too, and `ci.yml` runs fourteen jobs including
# an APK build — a real recurring cost for no benefit. This job checks nothing
# out and finishes in seconds, so it can afford to run whenever the title moves.
#
# The job id and its name are deliberately unchanged, so the status check keeps
# the `Commit convention` context that branch protection already names.
name: PR title

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]

# Reads one field from the event payload and never checks out the repository.
permissions: {}

jobs:
  commit-convention:
    name: Commit convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads only the pull request title from the event payload — it never
    # checks out the repository, so it needs no access to its contents.
    permissions: {}
    # The `if: github.event_name == 'pull_request'` guard that stood here in
    # ci.yml is gone: this workflow has no other trigger. What it guarded is
    # unchanged — the subject is the pull request title, which ADR-019 makes
    # the squash-merge commit message that lands in develop's history.
    # Overrides the workflow-level `mobile` default. This job has no checkout,
    # so `mobile/` does not exist on the runner and the step could not start —
    # it failed with a process-start error that reads as "your PR title is
    # wrong", which is the most misleading of open item 51's three
    # manifestations. `$GITHUB_WORKSPACE` itself is created by the runner
    # before any step, so `.` is a real directory even with nothing checked
    # out, and no checkout is needed to fix this.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Validate the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          TYPES = ["feat", "fix", "docs", "refactor", "test", "chore",
                   "perf", "style", "ci", "build", "revert"]

          HEADER = re.compile(
              r'^(?P<type>' + "|".join(TYPES) + r')'
              r'(?:\((?P<scope>[a-z0-9\-/]+)\))?'
              r'(?P<bang>!)?: (?P<subject>.+)$'
          )
          # Git generates these; they are not authored messages.
          EXEMPT = re.compile(r'^(Merge |Revert ")')

          title = os.environ["PR_TITLE"].strip()
          if EXEMPT.match(title):
              print(f"ok  git-generated message, exempt: {title}")
              sys.exit(0)

          errors = []
          m = HEADER.match(title)
          if not m:
              errors.append(
                  "must match 'type(scope): subject'. "
                  f"Allowed types: {', '.join(TYPES)}"
              )
          else:
              subject = m.group("subject")
              if len(title) > 72:
                  errors.append(f"header is {len(title)} characters; the limit is 72")
              if subject[0].isupper():
                  errors.append("subject must start with a lowercase letter")
              if subject.endswith("."):
                  errors.append("subject must not end with a full stop")
              if re.match(r'^(added|fixed|updated|changed|removed|adds|fixes)\b',
                          subject, re.I):
                  errors.append("subject must be imperative mood — 'add', not 'added'")

          if errors:
              print(f"::error::Pull request title does not follow ADR-020: {title}")
              for e in errors:
                  print(f"  - {e}")
              print("")
              print("  This title becomes the squash commit in develop (ADR-019),")
              print("  so it is the message that survives. See")
              print("  docs/git/commit-conventions.md")
              sys.exit(1)

          print(f"ok  {title}")
          PY
