# Scopes `public_member_api_docs` to this layer.
#
# ADR-022 §6.1 step 7 requires this file for every feature's `domain/` and
# `data/`, and the root `analysis_options.yaml` explains why it cannot live
# there: the Dart analyzer cannot scope a lint to a subdirectory from the root
# file. Volume 3 §3.7 §2 scopes the rule to "domain/ and data/ layers only".
# Registered as amendment A-025.
#
# Missing until Mission 5.4, because `features/onboarding/` had no `data/`
# file until then — Mission 5.1.2 created the feature with `presentation/`
# only, which the rule does not cover. There is still no `domain/` here: this
# feature's one contract lives in `core/onboarding/`, because `lib/app/` reads
# it and ADR-022 R2 forbids `app/` from importing a feature's `domain/`.
#
# Four `../` segments from `lib/features/<feature>/data/`:
# data -> onboarding -> features -> lib -> mobile.
include: ../../../../analysis_options.yaml

linter:
  rules:
    - public_member_api_docs
