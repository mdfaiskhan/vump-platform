name: mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Logging
  logger: ^2.5.0

  # Secure local storage
  flutter_secure_storage: ^9.2.2

  # Firebase platform
  firebase_core: ^4.13.0

  # Firebase Authentication — the identity provider Volume 4 Chapter 4.1
  # confirms and Chapter 4.7 designs the flow against. Confined to
  # `features/auth/data/` by the `Architecture boundaries` CI job.
  firebase_auth: ^6.5.7

  # The native Google account picker behind SH-02's SSO entry point.
  # FR-AUTH-02 words that entry point as enterprise SSO (SAML/OAuth); this
  # reads it more narrowly than written, and volume-amendments.md A-053
  # records the divergence. Confined to `features/auth/data/` with
  # `firebase_auth`.
  google_sign_in: ^7.2.0

  # Camera capture. Volume 3 Chapter 3.1 names this package by name —
  # "Flutter's official camera plugin, with a platform-channel extension for
  # ultra-wide lens selection" — so the choice is recorded, not taken here.
  # That same row flags the extension as an open engineering risk; amendment
  # A-057 records that the risk is now confirmed and Android-only.
  # Confined to `features/recording/data/`.
  camera: ^0.12.0+2
  # ADR-053. Promoted from transitive to direct because CameraPlatform is
  # the only correct renderer for a preview built from a texture id, and
  # package:camera does not export it. Confined to one named file by the
  # Architecture boundaries job.
  camera_platform_interface: ^2.13.1

  # Caches the per-device wide-angle eligibility verdict (Volume 5.2 §2:
  # "a fixed per-device-model decision made once at first launch and cached").
  # NOT secure storage — ADR-008 governs secrets and this holds none, only a
  # tier name and two version strings. Confined to `features/recording/data/`.
  shared_preferences: ^2.5.5

  # SHA-256 over each finalized chunk (Volume 5 Ch. 5.5 §1.2, FR-META-10).
  # Already in the tree transitively via Firebase; promoted to a direct
  # dependency because `depend_on_referenced_packages` forbids importing a
  # package this pubspec does not declare. Dart-team owned, and
  # `startChunkedConversion` is exactly the block-wise API §1.2 asks for.
  # Confined to `features/recording/data/`.
  crypto: ^3.0.7

  # Battery level for FR-CHK-03's Pre-Recording Checklist row. Volume 1 §5
  # requires the level be verified "before recording starts" and Volume 2
  # Ch. 2.7's C-07 requires the row show its current value ("Battery: 82%"),
  # neither of which `dart:io` can answer. Confined to
  # `features/recording/data/`.
  battery_plus: ^6.2.1

  # Network availability for FR-CHK-04, which asks whether upload "will start
  # immediately or be queued" — so the row needs the connection *type*, not a
  # reachability boolean. Confined to `features/recording/data/`.
  #
  # Both packages are `plus` ecosystem, BSD-3-Clause, and maintained by the
  # Flutter Community. They also make two thirds of amendment A-062's
  # `capture_conditions` gap reachable; that is deliberately NOT wired here,
  # because the group's third field (GPS) is still blocked on A-062 §3's
  # unresolved product decision.
  connectivity_plus: ^6.1.5

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Writable application directory for the local database.
  # ADR-009 Caveat 2: `databaseDirectoryProvider` is deliberately
  # unimplemented because resolving an app directory needs a platform plugin.
  # This is that plugin, read only in `main.dart` to supply the override.
  path_provider: ^2.1.6

  # Volume 5 Chapter 5.11 §1's Android foreground service. Volume 3 Chapter
  # 3.1 §2 names this package by name — "a foreground service
  # (flutter_foreground_task) driving Dio multipart uploads, with a persistent,
  # dismissible-only-on-completion notification" — so the choice is
  # transcribed, not taken by this mission.
  #
  # NOTE ON THE CITATION: Chapter 5.11's header says it expands "ADR-003
  # (Volume 3, Chapter 3.2)". That is Volume 3's own internal ADR numbering.
  # This repository's ADR-003 is state management (Riverpod). See A-077 and
  # open item 34 — the third instance of this collision in three missions.
  #
  # Confined to `features/upload/data/`, the same way ADR-034 confines a
  # Firebase *product* to the module that consumes it. The dispatcher in
  # `application/` reaches it only through `UploadServiceHost`.
  flutter_foreground_task: ^10.0.0

  # Code generation annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Volume 3 §3.1 names `mocktail` for unit testing and `integration_test` for
  # Chapter 9.7's tier; testing-standards.md recorded both as absent. Mission
  # 8.1 installs them to fulfil tiers this project already accepted rather than
  # to introduce a pattern. `golden_toolkit` stays declined — the existing raw
  # `matchesGoldenFile` pattern works and no friction justifies a third package.
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.2
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
